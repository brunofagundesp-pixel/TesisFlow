<div class="login-page">
  <div class="login-left">
    <div class="login-left-content">
      <h1>TesisFlow</h1>
      <p>Colabore com sua equipe, organize tarefas e entregue projetos com eficiencia.</p>
    </div>
  </div>
  <div class="login-right">
    <mat-card class="login-card">
      <mat-card-content>
        <div class="login-header">
          <div class="login-logo">TF</div>
          <h2>Entrar no TesisFlow</h2>
          <p>Fac,a login para continuar</p>
        </div>

        <form [formGroup]="form" (ngSubmit)="entrar()">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Email</mat-label>
            <input matInput type="email" formControlName="email" placeholder="seu@email.com">
          </mat-form-field>

          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Senha</mat-label>
            <input matInput type="password" formControlName="senha" placeholder="Sua senha">
          </mat-form-field>

          <button mat-flat-button color="primary" type="submit" class="w-100 login-btn" [disabled]="form.invalid || loading">
            {{ loading ? 'Entrando...' : 'Entrar' }}
          </button>

          @if (erro) {
            <p class="login-error">{{ erro }}</p>
          }
        </form>

        <div class="login-divider"><span>ou</span></div>

        <button mat-stroked-button class="w-100" routerLink="/registro">Criar conta</button>
      </mat-card-content>
    </mat-card>
  </div>
</div>
